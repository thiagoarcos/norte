name: Deploy PWA to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # npm ci borra node_modules y reinstala limpio desde el lock:
      # restaura el bit de ejecución del binario de vite (el repo commitea node_modules
      # y el shim .bin/vite venía sin permiso de ejecución → "vite: Permission denied").
      - name: Install
        run: npm ci

      # Invocamos vite vía npx (lo corre con Node, sin depender del bit de ejecución del shim).
      - name: Build
        run: npx --no-install vite build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
